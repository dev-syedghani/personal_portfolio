name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  schedule:
    # Rebuild every 6 hours so both the GitHub contribution graph
    # (scripts/fetch-contributions.mjs) and the live RubyGems download count
    # baked into the OG image stay current with no push and no manual step.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
